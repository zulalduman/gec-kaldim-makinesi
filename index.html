<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geç Kaldım Makinesi ⏰</title>
<style>
:root{
  --bg1:#ffe9d6; --bg2:#ffd1e3; --bg3:#d9e7ff;
  --card:rgba(255,255,255,.78); --ink:#2b2140; --muted:#7a6f90;
  --pri:#7c3aed; --pri2:#ec4899; --ok:#16a34a; --warn:#f59e0b; --bad:#ef4444;
  --chip:#fff; --shadow:0 20px 50px rgba(124,58,237,.18);
}
body.dark{
  --bg1:#1a1030; --bg2:#2a1245; --bg3:#0f1f45;
  --card:rgba(30,22,52,.8); --ink:#f3ecff; --muted:#a99cc7; --chip:#2b2147;
  --shadow:0 20px 50px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif; color:var(--ink);
  background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3)); background-size:300% 300%;
  animation:bg 18s ease infinite; transition:color .3s; overflow-x:hidden;
}
@keyframes bg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.float{position:fixed; font-size:2rem; opacity:.25; pointer-events:none; animation:fl 14s linear infinite}
@keyframes fl{from{transform:translateY(105vh) rotate(0)}to{transform:translateY(-15vh) rotate(360deg)}}
main{max-width:760px; margin:0 auto; padding:28px 18px 60px; position:relative; z-index:2}
header{text-align:center; margin-bottom:22px}
.clock{font-size:4rem; display:inline-block; animation:wob 2.5s ease-in-out infinite; transform-origin:50% 90%}
@keyframes wob{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
h1{margin:4px 0 6px; font-size:clamp(1.8rem,5vw,2.7rem); letter-spacing:-.5px;
  background:linear-gradient(90deg,var(--pri),var(--pri2)); -webkit-background-clip:text; background-clip:text; color:transparent}
header p{margin:0; color:var(--muted)}
.card{background:var(--card); backdrop-filter:blur(14px); border-radius:24px; padding:22px; box-shadow:var(--shadow); margin-bottom:18px; border:1px solid rgba(255,255,255,.4)}
.card h2{margin:0 0 12px; font-size:.85rem; text-transform:uppercase; letter-spacing:1.5px; color:var(--muted)}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{border:2px solid transparent; background:var(--chip); color:var(--ink); padding:9px 14px; border-radius:999px; cursor:pointer; font-size:.95rem; font-family:inherit; transition:.2s; box-shadow:0 2px 8px rgba(0,0,0,.06)}
.chip:hover{transform:translateY(-2px) scale(1.04)}
.chip.on{border-color:var(--pri); background:linear-gradient(135deg,var(--pri),var(--pri2)); color:#fff; font-weight:600}
.row{margin-bottom:18px}.row:last-child{margin-bottom:0}
.slider-wrap{display:flex; align-items:center; gap:14px}
input[type=range]{flex:1; accent-color:var(--pri); height:6px}
.minutes{min-width:110px; white-space:nowrap; text-align:right; font-weight:700; font-size:1.15rem; color:var(--pri)}
.go{width:100%; border:none; cursor:pointer; padding:18px; font-size:1.25rem; font-weight:800; color:#fff; border-radius:20px; font-family:inherit;
  background:linear-gradient(135deg,var(--pri),var(--pri2)); box-shadow:0 10px 25px rgba(236,72,153,.4); transition:.2s; margin-bottom:18px}
.go:hover{transform:translateY(-3px) scale(1.01)} .go:active{transform:scale(.97)}
.result{min-height:190px; position:relative}
.bubble{font-size:1.3rem; line-height:1.55; font-weight:500; min-height:100px; white-space:pre-wrap}
.bubble.spin{opacity:.55; filter:blur(1.2px); font-style:italic}
.bubble.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.92); opacity:0}to{transform:scale(1); opacity:1}}
.cursor::after{content:"▌"; animation:blink .7s steps(2) infinite; color:var(--pri)}
@keyframes blink{50%{opacity:0}}
.meter{margin-top:14px}
.meter-top{display:flex; justify-content:space-between; font-size:.9rem; color:var(--muted); margin-bottom:6px}
.bar{height:14px; background:rgba(124,58,237,.15); border-radius:99px; overflow:hidden}
.fill{height:100%; width:0; border-radius:99px; transition:width 1s cubic-bezier(.2,1,.3,1), background .5s}
.verdict{margin-top:8px; font-weight:700}
.actions{display:flex; flex-wrap:wrap; gap:8px; margin-top:16px}
.btn{border:none; background:var(--chip); color:var(--ink); padding:10px 14px; border-radius:12px; cursor:pointer; font-family:inherit; font-size:.92rem; box-shadow:0 2px 8px rgba(0,0,0,.08); transition:.15s}
.btn:hover{transform:translateY(-2px)} .btn.fav.on{background:#ffe0ec; color:#d6246e}
body.dark .btn.fav.on{background:#5a1a3a; color:#ff9ac4}
.list{display:flex; flex-direction:column; gap:10px}
.item{background:var(--chip); border-radius:14px; padding:12px 14px; font-size:.95rem; display:flex; gap:10px; align-items:flex-start; animation:pop .3s}
.item span.t{flex:1; cursor:pointer}
.item button{border:none; background:none; cursor:pointer; font-size:1.1rem}
.empty{color:var(--muted); font-style:italic; font-size:.92rem}
.tabs{display:flex; gap:8px; margin-bottom:12px}
.stats{text-align:center; color:var(--muted); font-size:.85rem; margin-top:8px}
.theme{position:fixed; top:14px; right:14px; z-index:5; border:none; background:var(--card); width:44px; height:44px; border-radius:50%; font-size:1.3rem; cursor:pointer; box-shadow:var(--shadow)}
.toast{position:fixed; bottom:26px; left:50%; transform:translate(-50%,100px); background:var(--ink); color:var(--bg1); padding:12px 20px; border-radius:99px; transition:.35s; z-index:20; font-weight:600}
.toast.show{transform:translate(-50%,0)}
canvas{position:fixed; inset:0; pointer-events:none; z-index:15}
footer{text-align:center; color:var(--muted); font-size:.8rem; margin-top:20px}
.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:16px}
.field span{display:block; font-size:.85rem; color:var(--muted); margin-bottom:6px; font-weight:700}
select{width:100%; padding:13px 14px; border-radius:14px; border:2px solid var(--pri); background:var(--chip); color:var(--ink); font-size:1rem; font-family:inherit; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.06)}
select:focus{outline:3px solid rgba(124,58,237,.3)}
</style>
</head>

<button class="theme" id="lang" style="right:66px;font-size:.9rem;font-weight:700" title="English">EN</button>
<button class="theme" id="theme" title="Tema">🌙</button>
<canvas id="confetti"></canvas>
<main>
  <header>
    <div class="clock">⏰</div>
    <h1 data-i18n="title">Geç Kaldım Makinesi</h1>

    <div class="grid">

  <button class="go" id="go" data-i18n="go">🎲 Bahane Üret <small style="font-weight:400;opacity:.8">(Boşluk tuşu)</small></button>

  <section class="card result">
    <h2 data-i18n="resultH">Bahanen</h2>
    <div class="bubble" id="bubble">Yukarıdan ayarlarını seç ve butona bas. Mükemmel bahane seni bekliyor…</div>
    <div class="meter" id="meter" hidden>
      <div class="meter-top"><span data-i18n="meter">İnandırıcılık</span><span id="pct">0%</span></div>
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div class="verdict" id="verdict"></div>
    </div>
    <div class="actions" id="actions" hidden>
      <button class="btn" id="copy" data-i18n="copy">📋 Kopyala</button>
      <button class="btn fav" id="fav">🤍 Favorile</button>
      <button class="btn" id="share" data-i18n="share">📤 Paylaş</button>
    </div>
  </section>

  <section class="card">
    <div class="tabs">
      <button class="chip on" data-tab="history" data-i18n="tabHist">🕘 Geçmiş</button>
      <button class="chip" data-tab="favs" data-i18n="tabFav">💖 Favoriler</button>
    </div>
    <div class="list" id="list"></div>
  </section>

  <div class="stats" id="stats"></div>
  <footer data-i18n="footer">Bu site tamamen şaka amaçlıdır. Gerçek hayatta dürüst olmak en iyisi (ama bazen de bu iş görür 😉).</footer>
</main>
<div class="toast" id="toast"></div>

function fillSelect(el,obj){for(const k in obj){const o=document.createElement("option");o.value=k;o.textContent=obj[k].label;el.appendChild(o)}}


function make(){
  const {PERSONS,STYLES,VEH,PRO,PROOF,PRO_OPEN,PRO_EFFECTS,PRO_BYE,CASUAL,OPEN,EFFECTS,FUN_EFFECTS}=DATA[LANG];
  const n=+$("#min").value, pk=$("#person").value, sk=$("#style").value;
  const p=PERSONS[pk], s=STYLES[sk], friend=(pk==="arkadas"), boss=(pk==="patron");
  const base=(boss && PRO[sk]) ? PRO[sk] : s.causes;
  let pool=base.filter(c=>n>=c[1]&&n<=c[2]);
  if(!pool.length) pool=base;
  const tier=(friend?CASUAL.open:(boss?PRO_OPEN:OPEN)).find(t=>n<=t[0])[1];
  const open=pick(tier).split("{n}").join(n);
  const V=VEH[$("#vehicle").value];
  let cause, fromV=false;
  if(V){
    const vp=V.causes.filter(c=>n>=c[1]&&n<=c[2]);
    const vpool=vp.length?vp:V.causes;
    fromV=(sk==="ulasim"||Math.random()<0.5);
    cause=pick(fromV?vpool:pool)[0];
  } else cause=pick(pool)[0];
  if(friend) CASUAL.words.forEach(w=>{cause=cause.split(w[0]).join(w[1])});
  const hi=pick(friend?CASUAL.hi:p.hi), fx=pick(sk==="eglenceli"?FUN_EFFECTS:(friend?CASUAL.effects:(boss?PRO_EFFECTS:EFFECTS))), bye=pick(friend?CASUAL.bye:(boss?PRO_BYE:p.bye));
  const fx2=(V && sk!=="eglenceli" && Math.random()<0.6) ? V.now : fx;
  const pk2=fromV?"ulasim":sk;
  const proof=(boss && sk!=="eglenceli" && PROOF[pk2] && Math.random()<0.5) ? " "+PROOF[pk2] : "";
  const text=`${hi} ${open} ${cause}. ${fx2}${proof} ${bye}`;
  let score=s.base - n/10 + (Math.random()*10-5);
  if(boss && sk!=="eglenceli") score+=4;
  score=Math.max(40,Math.min(98,Math.round(score)));
  return {text,score,style:sk,person:pk,n};
}

function verdict(sc){
  const V=U().verdicts;
  if(sc>=80) return [V[0],"#16a34a"];
  if(sc>=55) return [V[1],"#84cc16"];
  if(sc>=30) return [V[2],"#f59e0b"];
  if(sc>=12) return [V[3],"#f97316"];
  return [V[4],"#ef4444"];
}

let runId=0;
function makeFresh(){
  // aynı bahaneyi arka arkaya vermemek için en fazla 12 kez yeniden dener
  let r=make();
  for(let i=0;i<12 && history.some(h=>h.text===r.text);i++) r=make();
  return r;
}
async function generate(){
  const id=++runId;               // yeni tık, önceki animasyonu iptal eder; hiçbir zaman engellenmez
  const b=$("#bubble");
  try{
    const r=makeFresh();
    $("#meter").hidden=true; $("#actions").hidden=true;
    b.classList.remove("pop"); b.classList.add("spin");
    const flash=Object.values(DATA[LANG].STYLES).flatMap(s=>s.causes.map(c=>c[0]));
    for(let i=0;i<9;i++){ if(id!==runId) return; b.textContent="… "+pick(flash)+" …"; await sleep(80); }
    b.classList.remove("spin"); b.textContent="";
    b.classList.add("cursor");
    for(let i=0;i<=r.text.length;i++){
      if(id!==runId) return;
      b.textContent=r.text.slice(0,i);
      if(i%3===0) await sleep(12);
    }
    if(id!==runId) return;
    b.classList.remove("cursor"); b.classList.add("pop");
    state.current=r;
    const [v,c]=verdict(r.score);
    $("#meter").hidden=false; $("#actions").hidden=false;
    $("#fill").style.width="0%"; $("#fill").style.background=c;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ $("#fill").style.width=r.score+"%"; }));
    countUp($("#pct"), r.score);
    $("#verdict").textContent=v; $("#verdict").style.color=c;
    updateFav();
    history.unshift({text:r.text,score:r.score}); history=history.slice(0,100);
    count++; save(); renderList(); renderStats();
    if(r.score>=92) confetti();
  }catch(e){
    console.error(e);
    b.classList.remove("spin","cursor");
    b.textContent=U().err+" ("+e.message+")";
  }
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function countUp(el,to){
  let v=0; const t=setInterval(()=>{v+=Math.max(1,Math.round(to/25)); if(v>=to){v=to;clearInterval(t)} el.textContent=v+"%"},30);
}

function toast(m){const t=$("#toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1800)}
function updateFav(){
  const on=state.current && favs.includes(state.current.text);
  $("#fav").classList.toggle("on",!!on); $("#fav").textContent=on?U().favOn:U().fav;
}

$("#go").onclick=generate;
$("#copy").onclick=async()=>{ try{await navigator.clipboard.writeText(state.current.text); toast(U().tCopied)}catch(e){toast(U().tCopyFail)} };
$("#fav").onclick=()=>{
  const t=state.current.text;
  favs = favs.includes(t) ? favs.filter(x=>x!==t) : [t,...favs];
  save(); updateFav(); renderList();
  toast(favs.includes(t)?U().tFavAdd:U().tFavDel);
};
$("#share").onclick=async()=>{
  const t=state.current.text;
  if(navigator.share){ try{await navigator.share({text:t})}catch(e){} }
  else { try{await navigator.clipboard.writeText(t); toast(U().tShareCopied)}catch(e){} }
};
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{
  state.tab=b.dataset.tab;
  document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("on",x===b));
  renderList();
});
function renderList(){
  const L=$("#list"); L.innerHTML="";
  const items = state.tab==="history" ? history.map(h=>h.text) : favs;
  if(!items.length){ L.innerHTML='<div class="empty">'+(state.tab==="history"?U().emptyH:U().emptyF)+'</div>'; return; }
  items.forEach(t=>{
    const d=document.createElement("div"); d.className="item";
    d.innerHTML='<span class="t"></span><button title="Kopyala">📋</button>';
    d.querySelector(".t").textContent=t;
    d.querySelector("button").onclick=async()=>{try{await navigator.clipboard.writeText(t); toast(U().tCopied)}catch(e){}};
    L.appendChild(d);
  });
}
function renderStats(){ $("#stats").textContent=U().stats(count); }

$("#theme").onclick=()=>{
  document.body.classList.toggle("dark");
  const d=document.body.classList.contains("dark");
  $("#theme").textContent=d?"☀️":"🌙";
  try{localStorage.setItem("gk_dark",d?"1":"0")}catch(e){}
};
$("#theme").textContent=document.body.classList.contains("dark")?"☀️":"🌙";
document.addEventListener("keydown",e=>{
  if(e.code==="Space" && !["INPUT","BUTTON","SELECT"].includes(document.activeElement.tagName)){ e.preventDefault(); generate(); }
});

// floating emojis
["⏰","🚌","☕","🚇","🚗","📱","🌧️","🥐"].forEach((e,i)=>{
  const s=document.createElement("div"); s.className="float"; s.textContent=e;
  s.style.left=(i*13+3)+"%"; s.style.animationDelay=(-i*1.8)+"s"; s.style.animationDuration=(12+i*2)+"s";
  document.body.appendChild(s);
});

// confetti
const cv=$("#confetti"), cx=cv.getContext("2d");
function resize(){cv.width=innerWidth; cv.height=innerHeight} resize(); addEventListener("resize",resize);
function confetti(){
  const ps=Array.from({length:120},()=>({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*16,vy:Math.random()*-14-3,
    c:`hsl(${Math.random()*360},90%,60%)`,s:Math.random()*8+4,r:Math.random()*6}));
  let f=0;
  (function step(){
    cx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.2; cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore()});
    if(++f<110) requestAnimationFrame(step); else cx.clearRect(0,0,cv.width,cv.height);
  })();
}
$("#lang").onclick=()=>{
  LANG = LANG==="tr" ? "en" : "tr";
  try{localStorage.setItem("gk_lang",LANG)}catch(e){}
  applyLang();
};
applyLang();
